services:
  - type: web
    name: smartredact-backend
    env: docker
    rootDir: backend
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: SPACY_MODEL
        value: en_core_web_lg
      - key: RETENTION_HOURS
        value: "6"
      - key: CLEANUP_INTERVAL_MINUTES
        value: "15"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: LOG_LEVEL
        value: INFO
      - key: HOST
        value: 0.0.0.0
      # Leave API_KEY unset by default (no auth in local/frontend contract).
      # Add it in Render dashboard later if you want to enforce X-API-Key.
    disk:
      name: smartredact-data
      mountPath: /var/data
      sizeGB: 5
